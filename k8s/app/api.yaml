apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-service-account
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: my-service-account
      containers:
      - name: api
        image: 864981735845.dkr.ecr.eu-west-2.amazonaws.com/securecode:latest # Reemplaza con tu imagen Docker
        imagePullPolicy: IfNotPresent
        env:
          - name: PORT
            value: "5000"
          - name: ENVIRONMENT
            value: "prod"
        ports:
          - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 80
    targetPort: 5000
  type: ClusterIP # Cambia a ClusterIP si solo necesitas acceso interno