{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "app.fullname" . }}
spec:
  hosts:
    - "httpbin.example.com"
  gateways:
    - istio-ingress/mygateway
  http:
    - route:
        - destination:
            port:
              number: {{ .Values.service.port }}
            host: {{ include "app.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
{{- end }}