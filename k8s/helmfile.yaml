repositories:
  - name: istio
    url: https://istio-release.storage.googleapis.com/charts

releases:
  - name: istio-base
    chart: istio/base
    namespace: istio-system
    createNamespace: true
    values:
      - defaultRevision: default
    
  - name: istiod
    chart: istio/istiod
    namespace: istio-system
    needs:
      - istio-system/istio-base

  - name: istio-ingress
    chart: istio/gateway
    namespace: istio-ingress
    createNamespace: true
    needs:
      - istio-system/istiod

  - name: istio-gateway
    chart: istio
    namespace: istio-ingress
    needs:
      - istio-ingress/istio-ingress
    values:
      - istio/values.yaml

  - name: server
    chart: app
    namespace: server
    createNamespace: true
    needs:
      - istio-ingress/istio-gateway