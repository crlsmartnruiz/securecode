apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: demo-cluster
  region: eu-west-2
  version: "1.29"

nodeGroups:
  - name: ng-1
    instanceType: m5.large
    desiredCapacity: 1

addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
    resolveConflicts: overwrite
  - name: kube-proxy
    version: latest
  - name: eks-pod-identity-agent
    version: latest
